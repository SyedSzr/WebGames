<style>
/* Layout: one centered column. Header with level stepper, a score readout, a bench of glass tubes,
   a control row. Committed single look: a dark lab bench where the glassware and its effects are the only loud thing. */
:root {
  --bg: #0e151d;
  --panel: #172230;
  --ink: #e9eff6;
  --muted: #8b9cb1;
  --glass: rgba(190, 220, 255, 0.07);
  --edge: rgba(190, 220, 255, 0.30);
  --btn: #1f2d3d;
  --btn-edge: #2f4258;
  --primary: #e9eff6;
  --primary-ink: #0e151d;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Bricolage Grotesque', system-ui, sans-serif;
  --seg: clamp(30px, 8.5vw, 42px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  padding-inline: 16px;
  padding-block: 20px 28px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.app {
  max-width: 680px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: 22px;
  min-height: 100%;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.35rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  text-wrap: balance;
}
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper .lvl {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 0.95rem;
  min-width: 5.5em;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.icon-btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid var(--btn-edge);
  background: var(--btn);
  color: var(--ink);
  font-size: 1rem;
  cursor: pointer;
}
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.readout {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px 14px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 0.9rem;
  font-variant-numeric: tabular-nums;
}
.readout b { color: var(--ink); font-weight: 600; display: inline-block; }
#status { min-width: 0; }
.stats { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px; }
.stat.score b { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; }
.combo {
  display: inline-block;
  background: var(--ink);
  color: var(--primary-ink);
  border-radius: 999px;
  padding: 2px 10px;
  font-weight: 700;
  font-size: 0.82rem;
}
.bump { animation: bump 0.3s ease-out; }
.pulse { animation: bump 0.36s ease-out; }
@keyframes bump {
  0% { transform: scale(1); }
  40% { transform: scale(1.4); }
  100% { transform: scale(1); }
}
.stage {
  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-block: 28px 12px;
  min-height: 300px;
}
#board {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 26px 14px;
  max-width: 100%;
}
.tube {
  appearance: none;
  font: inherit;
  color: inherit;
  position: relative;
  display: flex;
  flex-direction: column-reverse;
  justify-content: flex-start;
  gap: 2px;
  width: calc(var(--seg) * 1.3);
  height: calc(var(--seg) * 4 + 20px);
  padding: 6px 5px;
  border: 2px solid var(--edge);
  border-top-color: transparent;
  border-radius: 6px 6px calc(var(--seg) * 0.7) calc(var(--seg) * 0.7);
  background: linear-gradient(90deg, rgba(255,255,255,0.09), var(--glass) 30%, var(--glass) 70%, rgba(255,255,255,0.04));
  cursor: pointer;
  transition: transform 0.16s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.tube.sel {
  transform: translateY(-18px);
  border-color: var(--ink);
  border-top-color: transparent;
  box-shadow: 0 14px 22px -10px rgba(233, 239, 246, 0.35);
  animation: bob 1.1s ease-in-out 0.18s infinite;
}
@keyframes bob {
  0%, 100% { transform: translateY(-18px); }
  50% { transform: translateY(-23px); }
}
.tube.done { border-color: var(--c); border-top-color: transparent; cursor: default; }
.tube:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.tube.enter { animation: enterUp 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards; animation-delay: calc(var(--n, 0) * 55ms); }
@keyframes enterUp {
  from { opacity: 0; transform: translateY(26px) scale(0.9); }
  to { opacity: 1; transform: none; }
}
.tube.tilt { z-index: 3; animation: tilt 0.4s ease-out; }
@keyframes tilt {
  0% { transform: translateY(-18px) rotate(var(--tilt, 14deg)); }
  40% { transform: translateY(-24px) rotate(calc(var(--tilt, 14deg) * 1.25)); }
  100% { transform: none; }
}
.tube.shake { animation: shake 0.34s ease-in-out; }
@keyframes shake {
  0%, 100% { transform: none; }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
.tube.celebrate { z-index: 3; animation: celebrate 0.7s ease-out 0.25s; }
@keyframes celebrate {
  0% { transform: none; box-shadow: 0 0 0 0 transparent; }
  30% { transform: scale(1.14, 0.94); box-shadow: 0 0 30px 6px var(--c); }
  60% { transform: scale(0.97, 1.06); }
  100% { transform: none; box-shadow: 0 0 0 0 transparent; }
}
.seg {
  flex: 0 0 var(--seg);
  height: var(--seg);
  background-color: var(--c);
  background-image: linear-gradient(100deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0) 42%);
  border-radius: 5px;
  display: grid;
  place-items: center;
  font-size: calc(var(--seg) * 0.42);
  line-height: 1;
  color: rgba(10, 16, 24, 0.78);
}
.seg:first-child { border-radius: 5px 5px calc(var(--seg) * 0.55) calc(var(--seg) * 0.55); }
.seg > i { font-style: normal; display: none; }
body.symbols .seg > i { display: block; }
.seg.pop { animation: drop 0.32s ease-out; }
@keyframes drop {
  0% { transform: translateY(-30px) scaleY(1.25); opacity: 0.3; }
  70% { transform: translateY(2px) scaleY(0.92); opacity: 1; }
  100% { transform: none; opacity: 1; }
}
.float {
  position: absolute;
  z-index: 6;
  pointer-events: none;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.05rem;
  white-space: nowrap;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
  animation: floatUp 1s ease-out forwards;
}
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
  15% { opacity: 1; transform: translate(-50%, -10px) scale(1.2); }
  100% { opacity: 0; transform: translate(-50%, -62px) scale(1); }
}
#fx {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 30;
}
.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn {
  font: inherit;
  font-weight: 600;
  padding: 11px 18px;
  border-radius: 999px;
  border: 1px solid var(--btn-edge);
  background: var(--btn);
  color: var(--ink);
  cursor: pointer;
}
.btn:disabled { opacity: 0.4; cursor: default; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--primary-ink); border-color: var(--ink); }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.icon-btn:focus-visible, .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
#win {
  position: absolute;
  inset: 0;
  z-index: 8;
  display: grid;
  place-items: center;
  background: rgba(14, 21, 29, 0.84);
  border-radius: 16px;
  padding: 16px;
  animation: fadeIn 0.3s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
#win .card {
  background: var(--panel);
  border: 1px solid var(--btn-edge);
  border-radius: 16px;
  padding: 24px 22px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
  max-width: 340px;
  animation: cardIn 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.3);
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(18px) scale(0.85); }
  to { opacity: 1; transform: none; }
}
#win h2 { margin: 0; font-family: var(--font-display); font-size: 1.1rem; text-wrap: balance; }
#win p { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.bigscore {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 2.6rem;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.badge {
  background: var(--ink);
  color: var(--primary-ink);
  border-radius: 999px;
  padding: 3px 12px;
  font-weight: 700;
  font-size: 0.8rem;
}
.help { color: var(--muted); font-size: 0.85rem; text-align: center; margin: 0; text-wrap: balance; }
@media (prefers-reduced-motion: reduce) {
  .tube, .tube.sel, .tube.enter, .tube.tilt, .tube.shake, .tube.celebrate,
  .seg.pop, .bump, .pulse, #win, #win .card { animation: none; transition: none; }
  .float { animation: none; }
}
</style>

<div class="app">
  <header>
    <h1>Decant</h1>
    <div class="stepper">
      <button class="icon-btn" id="prev" type="button" aria-label="Previous level">&#9664;</button>
      <div class="lvl" id="lvl">Level 1</div>
      <button class="icon-btn" id="next" type="button" aria-label="Next level">&#9654;</button>
    </div>
  </header>

  <div class="readout">
    <span id="status" aria-live="polite">Tap a tube to lift its top colour.</span>
    <span class="stats">
      <span class="stat score">Score <b id="score">0</b></span>
      <span class="combo" id="combo" hidden>&times;2</span>
      <span class="stat">Moves <b id="moves">0</b></span>
      <span class="stat">Best <b id="best">&ndash;</b></span>
    </span>
  </div>

  <div class="stage" id="stage">
    <div id="board"></div>
    <section id="win" hidden>
      <div class="card">

        <button class="btn primary" id="winNext" type="button">Next level</button>
        <button class="btn" id="winAgain" type="button">Play again</button>
      </div>
    </section>
  </div>

  <div class="controls">
    <button class="btn" id="undo" type="button">Undo</button>
    <button class="btn" id="restart" type="button">Restart</button>
    <button class="btn" id="addTube" type="button">+ Tube</button>
    <button class="btn" id="symbols" type="button" aria-pressed="false">Symbols</button>
  </div>
  <p class="help">Pour onto a matching colour or an empty tube. Back-to-back matching pours build a combo. Each tube holds four.</p>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
/*LOGIC*/
const CAP = 4;
const PALETTE = [
  { name: 'red', hex: '#ff5a5f', sym: '●' },
  { name: 'orange', hex: '#ff9f1c', sym: '▲' },
  { name: 'yellow', hex: '#ffd23f', sym: '■' },
  { name: 'green', hex: '#7bd957', sym: '◆' },
  { name: 'teal', hex: '#12b886', sym: '★' },
  { name: 'blue', hex: '#3ea6ff', sym: '✚' },
  { name: 'indigo', hex: '#7c6cff', sym: '♥' },
  { name: 'magenta', hex: '#d65db1', sym: '☾' },
  { name: 'brown', hex: '#b8865b', sym: '✖' },
  { name: 'grey', hex: '#dfe5ec', sym: '◐' }
];
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function levelColors(L) { return Math.min(PALETTE.length, 3 + Math.ceil((L - 1) / 2)); }
function levelPar(L) { return levelColors(L) * 3 + 4; }
function isDone(t) { return t.length === CAP && t.every(x => x === t[0]); }
function isWon(tubes) { return tubes.every(t => t.length === 0 || isDone(t)); }
function canPour(a, b) {
  if (!a.length || b.length >= CAP) return false;
  if (b.length && b[b.length - 1] !== a[a.length - 1]) return false;
  if (!b.length && a.every(x => x === a[0])) return false;
  return true;
}
function pour(tubes, i, j) {
  const a = tubes[i], b = tubes[j];
  const c = a[a.length - 1];
  let n = 0;
  while (a.length && a[a.length - 1] === c && b.length < CAP) { b.push(a.pop()); n++; }
  return n;
}
function hasMoves(tubes) {
  for (let i = 0; i < tubes.length; i++)
    for (let j = 0; j < tubes.length; j++)
      if (i !== j && canPour(tubes[i], tubes[j])) return true;
  return false;
}
function solvable(start, cap) {
  const seen = new Set();
  let nodes = 0;
  function key(ts) { return ts.map(t => t.join('')).sort().join('|'); }
  function dfs(ts) {
    if (isWon(ts)) return true;
    if (++nodes > cap) return false;
    const k = key(ts);
    if (seen.has(k)) return false;
    seen.add(k);
    for (let i = 0; i < ts.length; i++) {
      for (let j = 0; j < ts.length; j++) {
        if (i !== j && canPour(ts[i], ts[j])) {
          const next = ts.map(t => t.slice());
          pour(next, i, j);
          if (dfs(next)) return true;
        }
      }
    }
    return false;
  }
  return dfs(start.map(t => t.slice()));
}
function generate(L) {
  const colors = levelColors(L);
  for (let attempt = 0; attempt < 300; attempt++) {
    const r = rng(L * 7919 + attempt * 104729 + 13);
    const units = [];
    for (let c = 0; c < colors; c++) for (let k = 0; k < CAP; k++) units.push(c);
    for (let i = units.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [units[i], units[j]] = [units[j], units[i]];
    }
    const tubes = [];
    for (let i = 0; i < colors; i++) tubes.push(units.slice(i * CAP, (i + 1) * CAP));
    tubes.push([], []);
    if (tubes.some(isDone)) continue;
    if (solvable(tubes, 40000)) return tubes;
  }
  return null;
}
/* Scoring: 10 per unit poured times the combo multiplier, +100 times the multiplier for finishing a tube.
   The combo grows with each back-to-back pour onto a matching colour (max x5) and resets on a pour into an empty tube. */
function scorePour(n, streak, completed) {
  const mult = Math.max(1, streak);
  return { mult, gain: n * 10 * mult + (completed ? 100 * mult : 0) };
}
function clearBonus(L, moves) { return 250 + 25 * Math.max(0, levelPar(L) - moves); }
/*END LOGIC*/

const $ = id => document.getElementById(id);
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
let S = null;
let progress = { unlocked: 1, best: {}, bestScore: {} };

function loadProgress() {
  try {
    const raw = localStorage.getItem('decant-progress');
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p.unlocked === 'number') {
        progress = { unlocked: p.unlocked, best: p.best || {}, bestScore: p.bestScore || {} };
      }
    }
  } catch (e) {}
}
function saveProgress() {
  try { localStorage.setItem('decant-progress', JSON.stringify(progress)); } catch (e) {}
}
const clone = ts => ts.map(t => t.slice());

/* ---------- particles ---------- */
const cv = $('fx');
const ctx = cv.getContext('2d');
let W = 0, H = 0, parts = [], raf = 0, lastT = 0;
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function spawn(p) {
  parts.push(p);
  if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(tick); }
}
function tick(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  ctx.clearRect(0, 0, W, H);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    if (p.delay > 0) { p.delay -= dt; continue; }
    if (p.type === 'arc') {
      p.t += dt / p.dur;
      if (p.t >= 1) { parts.splice(i, 1); if (p.onEnd) p.onEnd(p); continue; }
      const t = p.t, u = 1 - t;
      p.x = u * u * p.x0 + 2 * u * t * p.cx + t * t * p.x1;
      p.y = u * u * p.y0 + 2 * u * t * p.cy + t * t * p.y1;
      ctx.globalAlpha = 0.28; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
      continue;
    }
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    if (p.type === 'ring') {
      const k = 1 - p.life / p.max;
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 4 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r0 + (p.r1 - p.r0) * k, 0, 6.2832); ctx.stroke();
      continue;
    }
    p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === 'dot') {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * ctx.globalAlpha), 0, 6.2832); ctx.fill();
    } else if (p.type === 'rect') {
      p.vx *= 0.992; p.rot += p.vr * dt;
      ctx.globalAlpha = Math.min(1, p.life / 0.5);
      ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.scale(1, Math.cos(p.rot * 2.3));
      ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.6);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  if (parts.length) raf = requestAnimationFrame(tick);
  else { raf = 0; ctx.clearRect(0, 0, W, H); }
}
function burst(x, y, color, n, speed, up) {
  if (REDUCED) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.2832;
    const s = speed * (0.35 + Math.random() * 0.65);
    const life = 0.45 + Math.random() * 0.4;
    spawn({ type: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (up || 0), g: 700, life, max: life, size: 2 + Math.random() * 3.2, color, delay: 0 });
  }
}
function ring(x, y, color, r1) {
  if (REDUCED) return;
  spawn({ type: 'ring', x, y, r0: 8, r1: r1 || 70, life: 0.55, max: 0.55, color, delay: 0 });
}
function confetti(x, y, n, base, spread, cols) {
  if (REDUCED) return;
  for (let i = 0; i < n; i++) {
    const a = base + (Math.random() - 0.5) * spread;
    const s = 280 + Math.random() * 420;
    const life = 1.5 + Math.random() * 0.9;
    spawn({ type: 'rect', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 650, life, max: life, size: 6 + Math.random() * 6, color: cols[(Math.random() * cols.length) | 0], rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 18, delay: 0 });
  }
}
function confettiRain(n, cols) {
  if (REDUCED) return;
  for (let i = 0; i < n; i++) {
    spawn({ type: 'rect', x: Math.random() * W, y: -12, vx: (Math.random() - 0.5) * 70, vy: 80 + Math.random() * 120, g: 150, life: 3.2, max: 3.2, size: 6 + Math.random() * 6, color: cols[(Math.random() * cols.length) | 0], rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 12, delay: Math.random() * 1.3 });
  }
}
function pourFx(from, to, n, hex) {
  if (REDUCED) return;
  const kids = $('board').children;
  const a = kids[from].getBoundingClientRect();
  const b = kids[to].getBoundingClientRect();
  const x0 = a.left + a.width / 2, y0 = a.top + 6;
  const top = kids[to].lastElementChild;
  const len = kids[to].children.length;
  const sh = top ? top.offsetHeight : 30;
  const x1 = b.left + b.width / 2;
  const y1 = b.bottom - 10 - len * (sh + 2) + 4;
  for (let i = 0; i < n; i++) {
    spawn({
      type: 'arc', delay: i * 0.06, dur: 0.26, t: 0, r: 4.5, color: hex,
      x0, y0, x1, y1, cx: (x0 + x1) / 2, cy: Math.min(y0, y1) - 60 - i * 8, x: x0, y: y0,
      onEnd: p => burst(p.x1, p.y1, hex, 5, 130, 70)
    });
  }
}
function completeFx(i, hex) {
  const kid = $('board').children[i];
  if (!kid) return;
  const r = kid.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  ring(cx, cy, hex, 90);
  ring(cx, cy, '#ffffff', 55);
  burst(cx, cy, hex, 30, 340, 90);
  burst(cx, cy, '#ffffff', 10, 260, 60);
}
function celebrate() {
  if (REDUCED) return;
  const cols = PALETTE.slice(0, levelColors(S.level)).map(p => p.hex).concat(['#ffffff']);
  confetti(W * 0.08, H * 0.8, 46, -1.15, 0.9, cols);
  confetti(W * 0.92, H * 0.8, 46, -Math.PI + 1.15, 0.9, cols);
  confetti(W * 0.5, H * 0.88, 40, -Math.PI / 2, 1.2, cols);
  confettiRain(60, cols);
}
function floatText(txt, i, color) {
  const stage = $('stage');
  const kid = $('board').children[i];
  if (!kid) return;
  const sr = stage.getBoundingClientRect();
  const tr = kid.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = txt;
  el.style.left = (tr.left + tr.width / 2 - sr.left) + 'px';
  el.style.top = (tr.top - sr.top - 6) + 'px';
  el.style.color = color;
  stage.appendChild(el);
  setTimeout(() => el.remove(), 1050);
}

/* ---------- number tweens ---------- */
function countTo(el, from, to, dur) {
  el._tok = (el._tok || 0) + 1;
  const tok = el._tok;
  if (REDUCED || from === to) { el.textContent = String(to); return; }
  const t0 = performance.now();
  function step(now) {
    if (el._tok !== tok) return;
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = String(Math.round(from + (to - from) * e));
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function pulse(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}
function setScore(target, instant) {
  const el = $('score');
  const from = parseInt(el.textContent, 10) || 0;
  if (instant) { el._tok = (el._tok || 0) + 1; el.textContent = String(target); return; }
  if (target > from) pulse(el, 'bump');
  countTo(el, from, target, 450);
}

/* ---------- game state ---------- */
function newState(L) {
  const tubes = generate(L) || [[0, 0, 0, 0], [], []];
  return { level: L, tubes, history: [], sel: -1, moves: 0, added: false, won: false, note: '', score: 0, streak: 0, result: null, fx: null };
}
function loadLevel(L) {
  S = newState(L);
  S.fx = { intro: true };
  $('win').hidden = true;
  setScore(0, true);
  render();
}
function describe(t, i) {
  const parts = t.length ? t.map(c => PALETTE[c].name).join(', ') : 'empty';
  return 'Tube ' + (i + 1) + ': ' + parts;
}
function render() {
  const board = $('board');
  board.innerHTML = '';
  const fx = S.fx;
  S.fx = null;
  S.tubes.forEach((t, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tube' + (S.sel === i ? ' sel' : '');
    b.dataset.i = String(i);
    if (isDone(t)) { b.classList.add('done'); b.style.setProperty('--c', PALETTE[t[0]].hex); }
    b.setAttribute('aria-label', describe(t, i) + (S.sel === i ? ', selected' : ''));
    t.forEach((c, k) => {
      const s = document.createElement('span');
      s.className = 'seg';
      s.style.setProperty('--c', PALETTE[c].hex);
      const sym = document.createElement('i');
      sym.textContent = PALETTE[c].sym;
      s.appendChild(sym);
      if (fx && fx.pop && fx.pop.i === i && k >= t.length - fx.pop.n) s.classList.add('pop');
      b.appendChild(s);
    });
    board.appendChild(b);
  });
  $('lvl').textContent = 'Level ' + S.level;
  $('moves').textContent = String(S.moves);
  const bs = progress.bestScore[S.level];
  $('best').textContent = bs ? String(bs) : '–';
  $('prev').disabled = S.level <= 1;
  $('next').disabled = S.level >= progress.unlocked;
  $('undo').disabled = S.history.length === 0 || S.won;
  $('addTube').disabled = S.added || S.won;
  const cb = $('combo');
  if (S.streak >= 2) { cb.hidden = false; cb.textContent = '×' + S.streak; } else { cb.hidden = true; }
  $('status').textContent = S.note || (S.sel >= 0 ? 'Now tap where to pour.' : 'Tap a tube to lift its top colour.');
  applyFx(fx);
}
function applyFx(fx) {
  if (!fx) return;
  const kids = $('board').children;
  if (fx.intro) {
    for (let i = 0; i < kids.length; i++) { kids[i].style.setProperty('--n', String(i)); kids[i].classList.add('enter'); }
  }
  if (fx.shake != null && kids[fx.shake]) kids[fx.shake].classList.add('shake');
  if (fx.from != null && kids[fx.from] && kids[fx.to]) {
    const src = kids[fx.from], dst = kids[fx.to];
    const dir = dst.getBoundingClientRect().left > src.getBoundingClientRect().left ? 1 : -1;
    src.style.setProperty('--tilt', (dir * 16) + 'deg');
    src.classList.add('tilt');
    const hex = PALETTE[fx.color].hex;
    pourFx(fx.from, fx.to, fx.n, hex);
    floatText('+' + fx.gain + (fx.mult > 1 ? ' ×' + fx.mult : ''), fx.to, hex);
    if (fx.complete != null) {
      dst.classList.add('celebrate');
      setTimeout(() => completeFx(fx.to, hex), 280);
    }
  }
}
function snapshot() { S.history.push({ tubes: clone(S.tubes), moves: S.moves, score: S.score, streak: S.streak }); }

function onTube(i) {
  if (S.won) return;
  S.note = '';
  const t = S.tubes[i];
  if (S.sel === -1) {
    if (t.length && !isDone(t)) S.sel = i;
  } else if (S.sel === i) {
    S.sel = -1;
  } else if (canPour(S.tubes[S.sel], t)) {
    const from = S.sel;
    const wasEmpty = t.length === 0;
    snapshot();
    const src = S.tubes[from];
    const color = src[src.length - 1];
    const n = pour(S.tubes, from, i);
    S.moves++;
    S.streak = wasEmpty ? 0 : Math.min(5, S.streak + 1);
    const completed = isDone(S.tubes[i]);
    const sc = scorePour(n, S.streak, completed);
    S.score += sc.gain;
    S.sel = -1;
    S.fx = { from, to: i, n, color, pop: { i, n }, complete: completed ? i : null, gain: sc.gain, mult: sc.mult };
    afterMove();
    return;
  } else if (t.length && !isDone(t)) {
    S.sel = i;
  } else {
    S.fx = { shake: i };
    S.note = isDone(t) ? 'That tube is already full.' : "That pour doesn't help.";
  }
  render();
}
function afterMove() {
  if (isWon(S.tubes)) { win(); return; }
  if (!hasMoves(S.tubes)) S.note = 'No moves left. Undo, restart or add a tube.';
  render();
  setScore(S.score);
  if (S.streak >= 2) pulse($('combo'), 'pulse');
}
function win() {
  const ref = S;
  S.won = true;
  const bonus = clearBonus(S.level, S.moves);
  S.score += bonus;
  const prevScore = progress.bestScore[S.level] || 0;
  const newBest = S.score > prevScore;
  if (newBest) progress.bestScore[S.level] = S.score;
  const prevMoves = progress.best[S.level];
  if (!prevMoves || S.moves < prevMoves) progress.best[S.level] = S.moves;
  progress.unlocked = Math.max(progress.unlocked, S.level + 1);
  saveProgress();
  S.result = { bonus, par: levelPar(S.level), newBest };
  render();
  setScore(S.score);
  setTimeout(() => { if (S === ref && S.won) { showWin(true); } }, 850);
}
function showWin(fanfare) {
  const r = S.result;
  if (!r) return;
  $('winTitle').textContent = 'Level ' + S.level + ' sorted';
  countTo($('winScore'), 0, S.score, 900);
  $('winBadge').textContent = r.newBest ? 'New best score' : 'Best ' + (progress.bestScore[S.level] || S.score);
  $('winText').textContent = S.moves + ' moves · par ' + r.par + ' · clear bonus +' + r.bonus;
  $('win').hidden = false;
  if (fanfare) celebrate();
  $('winNext').focus();
}
function undo() {
  if (!S.history.length || S.won) return;
  const h = S.history.pop();
  const count = S.tubes.length;
  S.tubes = clone(h.tubes);
  while (S.tubes.length < count) S.tubes.push([]);
  S.moves = h.moves;
  S.score = h.score;
  S.streak = h.streak;
  S.sel = -1;
  S.note = '';
  render();
  setScore(S.score, true);
}
function addTube() {
  if (S.added || S.won) return;
  S.tubes.push([]);
  S.added = true;
  S.note = 'Extra tube added.';
  render();
}

$('board').addEventListener('click', e => {
  const b = e.target.closest('.tube');
  if (b) onTube(Number(b.dataset.i));
});
$('undo').addEventListener('click', undo);
$('restart').addEventListener('click', () => loadLevel(S.level));
$('addTube').addEventListener('click', addTube);
$('prev').addEventListener('click', () => { if (S.level > 1) loadLevel(S.level - 1); });
$('next').addEventListener('click', () => { if (S.level < progress.unlocked) loadLevel(S.level + 1); });
$('winNext').addEventListener('click', () => loadLevel(S.level + 1));
$('winAgain').addEventListener('click', () => loadLevel(S.level));
$('symbols').addEventListener('click', e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', String(on));
  document.body.classList.toggle('symbols', on);
  try { localStorage.setItem('decant-symbols', on ? '1' : '0'); } catch (err) {}
});

function start(data) {
  loadProgress();
  try {
    if (localStorage.getItem('decant-symbols') === '1') {
      document.body.classList.add('symbols');
      $('symbols').setAttribute('aria-pressed', 'true');
    }
  } catch (e) {}
  if (data && data.tubes && data.level) {
    S = {
      level: data.level, tubes: data.tubes, history: data.history || [], sel: -1, moves: data.moves || 0,
      added: !!data.added, won: !!data.won, note: '', score: data.score || 0, streak: data.streak || 0,
      result: data.result || null, fx: null
    };
    setScore(S.score, true);
    render();
    if (S.won) showWin(false);
  } else {
    loadLevel(progress.unlocked);
  }
  try {
    window.claude?.hot?.snapshot?.(() => ({
      level: S.level, tubes: S.tubes, history: S.history, moves: S.moves, added: S.added,
      won: S.won, score: S.score, streak: S.streak, result: S.result
    }));
  } catch (e) {}
}
try {
  if (window.claude?.hot?.ready) window.claude.hot.ready(start);
  else start(window.claude?.hot?.data ?? {});
} catch (e) { start({}); }
</script>

</body></html>
