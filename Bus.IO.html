<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bus.IO</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#20232b;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff;touch-action:none;user-select:none}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,18,28,.72);backdrop-filter:blur(3px);z-index:5}
  .overlay.hidden{display:none}
  .card{background:linear-gradient(160deg,#2f3550,#222640);border:3px solid #ffd23f;border-radius:22px;padding:26px 30px;max-width:460px;width:92%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  h1{margin:0 0 4px;font-size:40px;line-height:1;color:#ffd23f;text-shadow:0 4px 0 #b3811a;letter-spacing:1px}
  h1 small{display:block;font-size:20px;color:#fff;text-shadow:none;letter-spacing:6px;margin-top:4px}
  p{margin:10px 0;color:#cfd6ee;font-size:14px;line-height:1.4}
  input[type=text]{width:100%;padding:10px 12px;border-radius:12px;border:2px solid #4a5280;background:#161a2e;color:#fff;font-size:16px;text-align:center;margin:6px 0}
  .swatches{display:flex;gap:10px;justify-content:center;margin:10px 0 14px}
  .sw{width:38px;height:38px;border-radius:50%;border:4px solid transparent;cursor:pointer}
  .sw.sel{border-color:#fff;transform:scale(1.15)}
  button{font:inherit;font-weight:bold;font-size:22px;color:#3a2600;background:linear-gradient(#ffe066,#ffb703);border:none;border-bottom:5px solid #b37a00;border-radius:16px;padding:12px 38px;cursor:pointer}
  button:active{transform:translateY(3px);border-bottom-width:2px}
  /* ---- results screen ---- */
  #end{background:rgba(10,16,48,.5);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  #end .panel{position:relative;width:min(92vw,430px);margin-top:50px;padding:76px 14px 26px;border-radius:46px;text-align:center;
    background:linear-gradient(#21459f,#12296e);border:6px solid #ffc61a;box-shadow:0 0 0 3px #c98a00,0 24px 60px rgba(0,0,0,.65),inset 0 0 0 4px #2f5fd0}
  #end .crown{position:absolute;left:50%;top:-104px;width:116px;transform:translateX(-50%);filter:drop-shadow(0 0 16px rgba(255,200,40,.9))}
  #end .ribbon{position:absolute;left:50%;top:-44px;transform:translateX(-50%);width:92%;padding:10px 0 6px;
    background:linear-gradient(#4a97ff,#1f5fd8);border:4px solid #9cc8ff;border-radius:30px 30px 44px 44px;box-shadow:0 8px 0 #153f99}
  #end h2{margin:0;font-size:clamp(40px,13vw,58px);line-height:1.05;color:#ffcf33;letter-spacing:1px;
    -webkit-text-stroke:2px #e08a00;text-shadow:0 5px 0 #b86a00,0 8px 12px rgba(0,0,0,.35)}
  #end .list{background:#0c1a4b;border-radius:26px;padding:8px 6px;box-shadow:inset 0 3px 10px rgba(0,0,0,.45)}
  #end .row{display:flex;align-items:center;padding:9px 14px;border-radius:16px;font-size:clamp(17px,5vw,22px);font-weight:bold;color:#fff}
  #end .row:nth-child(even){background:rgba(255,255,255,.05)}
  #end .rk{width:40px;text-align:left}
  #end .dot{width:22px;height:22px;border-radius:50%;margin-right:16px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.4)}
  #end .nm{flex:1;text-align:left}
  #end .pts{text-align:right}
  #end .row.me{margin-top:6px;color:#fff3c4;background:linear-gradient(90deg,#8c5a0c,#c8891d,#8c5a0c);border:3px solid #ffc61a;box-shadow:0 0 14px rgba(255,190,40,.5)}
  #end #againBtn{margin-top:20px;font-size:clamp(24px,7vw,32px);padding:14px 40px;border-radius:44px;color:#3a2600;border:4px solid #ffd24a;
    background:linear-gradient(#fff07a,#ffb703 60%,#ffa400);border-bottom:8px solid #b87300;box-shadow:0 8px 18px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.6)}
  #end #againBtn:active{transform:translateY(4px);border-bottom-width:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="overlay" id="menu">
  <div class="card">
    <h1>BUS.IO<small>PARTY ARENA</small></h1>
    <p>Grab passengers, rush them to your <b>depot</b>, and grow your bus into a monster train. Ram into other buses' <b>bodies</b> and they'll spill their riders!</p>
    <input type="text" id="nameIn" maxlength="10" placeholder="Your name" value="You">
    <div class="swatches" id="swatches"></div>
    <p style="font-size:13px"><b>Steer:</b> drag (touch or mouse) / WASD / arrows &nbsp; <b>Boost:</b> Space / hold BOOST bar<br>Gold riders are worth 5!</p>
    <button id="playBtn">PLAY!</button>
  </div>
</div>

<div class="overlay hidden" id="end">
  <div class="panel">
    <svg class="crown" viewBox="0 0 120 90"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe66b"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs>
      <path d="M12 74 L4 24 L38 46 L60 8 L82 46 L116 24 L108 74 Z" fill="url(#cg)" stroke="#b86a00" stroke-width="5" stroke-linejoin="round"/>
      <rect x="12" y="66" width="96" height="14" rx="6" fill="#ffb703" stroke="#b86a00" stroke-width="4"/>
      <circle cx="60" cy="40" r="7" fill="#ff5a5a"/><circle cx="4" cy="24" r="6" fill="#ffe66b"/><circle cx="116" cy="24" r="6" fill="#ffe66b"/><circle cx="60" cy="8" r="6" fill="#ffe66b"/></svg>
    <div class="ribbon"><h2 id="endTitle">TIME UP!</h2></div>
    <div class="list" id="board"></div>
    <button id="againBtn">PLAY AGAIN</button>
  </div>
</div>

<script>
(()=>{
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let cw=0,ch=0,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);cw=innerWidth;ch=innerHeight;cv.width=cw*dpr;cv.height=ch*dpr}
addEventListener('resize',resize);resize();

// ---------- constants ----------
const WORLD=4800,CELL=400,ROAD=140,GAP=38,ROUND_TIME=120,MAX_PASS=650,BOT_COUNT=17,CAP_PER_CARRIAGE=8;
const COLORS=['#ffc107','#ef4444','#3b82f6','#22c55e','#a855f7','#fb7185'];
const BOT_NAMES=['Zippy','Turbo','Mia','Chip','Rocket','Nova','Bolt','Pixel','Gizmo','Waffle','Dash','Blaze','Pogo','Yeti','Comet','Ziggy','Taco','Ninja','Mochi','Sparky','Bean','Otto'];
const PASS_COLORS=['#f87171','#60a5fa','#34d399','#fbbf24','#c084fc','#f472b6','#fb923c','#e5e7eb'];

// ---------- audio ----------
let actx=null;
function beep(f,d=.08,type='sine',v=.07,slide=0){
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,actx.currentTime);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),actx.currentTime+d);
    g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);
  }catch(e){}
}

// ---------- state ----------
let state='menu',timeLeft=ROUND_TIME,countdown=0;
let buses=[],pass=[],floats=[],parts=[],player=null;
let myColor=COLORS[0],myName='You';
const cam={x:0,y:0,z:1};
const keys={};let pointer={x:0,y:0,active:false};let boostHeld=false;

function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d}

class Bus{
  constructor(d,name,color,human,idx){
    this.idx=idx;this.name=name;this.color=color;this.human=human;
    this.depot={x:d[0],y:d[1]};
    this.x=d[0];this.y=d[1];
    this.ang=Math.atan2(WORLD/2-d[1],WORLD/2-d[0]);
    this.speed=0;this.riders=[];this.score=0;this.delivered=0;this.carriages=1;
    this.stun=0;this.inv=0;this.stamina=1;this.boosting=false;this.unloadT=0;
    this.trail=[];this.parts=[];
    for(let i=1;i<=140;i++)this.trail.push({x:this.x-Math.cos(this.ang)*i*6,y:this.y-Math.sin(this.ang)*i*6});
    this.target=null;this.retarget=0;this.wander=rnd(0,6.28);
    this.computeParts();
  }
  get cap(){return 8+4*this.carriages}
  computeParts(){
    const need=this.carriages;this.parts.length=0;
    let prev={x:this.x,y:this.y},acc=0,k=1;
    for(const t of this.trail){
      const seg=Math.hypot(t.x-prev.x,t.y-prev.y);
      while(k<=need&&acc+seg>=GAP*k){
        const f=(GAP*k-acc)/(seg||1);
        this.parts.push({x:prev.x+(t.x-prev.x)*f,y:prev.y+(t.y-prev.y)*f,a:this.ang});
        k++;
      }
      acc+=seg;prev=t;if(k>need)break;
    }
    let px=this.x,py=this.y;
    for(const p of this.parts){p.a=Math.atan2(px-p.x,-(py-p.y))-Math.PI/2+Math.PI/2;p.a=Math.atan2(py-p.y,px-p.x);px=p.x;py=p.y}
  }
}

function spawnPassenger(x,y,v){
  pass.push({x:x??rnd(60,WORLD-60),y:y??rnd(60,WORLD-60),c:PASS_COLORS[(Math.random()*PASS_COLORS.length)|0],v:v||(Math.random()<.07?5:1),ph:Math.random()*6.28,vx:0,vy:0});
}

function startGame(){
  buses=[];pass=[];floats=[];parts=[];
  const spots=[],n=WORLD/CELL;
  for(let gy=1;gy<n;gy++)for(let gx=1;gx<n;gx++)spots.push([gx*CELL,gy*CELL]);
  spots.sort(()=>Math.random()-.5);
  player=new Bus(spots[0],myName,myColor,true,0);buses.push(player);
  const names=BOT_NAMES.slice().sort(()=>Math.random()-.5);
  for(let i=1;i<=BOT_COUNT;i++){
    const hue=Math.round((i*137.5)%360);
    buses.push(new Bus(spots[i],names[i%names.length],`hsl(${hue},75%,55%)`,false,i));
  }
  for(let i=0;i<MAX_PASS;i++)spawnPassenger();
  timeLeft=ROUND_TIME;countdown=3.4;state='count';
  cam.x=player.x;cam.y=player.y;
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
  beep(440,.12,'square',.05);
  joy.id=null;joy.active=false;joy.mag=0;
  try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('portrait').catch(()=>{})}catch(e){}
}

function endGame(){
  state='end';
  const sorted=buses.slice().sort((a,b)=>b.score-a.score);
  const win=sorted[0]===player;
  document.getElementById('endTitle').textContent=win?'YOU WIN!':'TIME UP!';
  const rows=sorted.slice(0,8);if(!rows.includes(player))rows.push(player);
  document.getElementById('board').innerHTML=rows.map(b=>
    `<div class="row${b===player?' me':''}"><span class="rk">${sorted.indexOf(b)+1}.</span><span class="dot" style="background:${b.color}"></span><span class="nm">${b===player?'You':esc(b.name)}</span><span class="pts">${b.score} pts</span></div>`).join('');
  document.getElementById('end').classList.remove('hidden');
  beep(win?660:330,.4,'triangle',.08,win?400:-120);
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

// ---------- input ----------
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){boostHeld=true;e.preventDefault()}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')boostHeld=false});
// HUD hit areas use the same 941x1672 design space as drawHUD
function hudHit(x,y){
  const s=hudScale();
  if(Math.hypot(x-(cw-75*s),y-(ch-96*s))<60*s)return 'pause';
  if(x<365*s&&y>125*s&&y<210*s)return 'boost'; // press & hold the BOOST bar
  return null;
}
let boostPtr=null;
function togglePause(){
  if(state==='play'||state==='count'){pausedFrom=state;state='paused'}
  else if(state==='paused')state=pausedFrom;
}
let pausedFrom='play';
addEventListener('keydown',e=>{if(e.key==='p'||e.key==='Escape')togglePause()});
// floating joystick: appears wherever a thumb lands, follows the thumb if dragged past its rim
const joy={id:null,active:false,bx:0,by:0,kx:0,ky:0,alpha:0,ang:0,mag:0};
const joyR=()=>Math.max(52,Math.min(cw,ch)*.15);
function joyMove(x,y){
  const R=joyR();let dx=x-joy.bx,dy=y-joy.by,d=Math.hypot(dx,dy);
  if(d>R){const ex=d-R;joy.bx+=dx/d*ex;joy.by+=dy/d*ex;dx=x-joy.bx;dy=y-joy.by;d=R}
  joy.kx=joy.bx+dx;joy.ky=joy.by+dy;
  joy.mag=d/R;if(d>3)joy.ang=Math.atan2(dy,dx);
}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{
  if(e.pointerId===boostPtr)return;
  if(e.pointerId===joy.id){joyMove(e.clientX,e.clientY);return}
});
cv.addEventListener('pointerdown',e=>{
  const h=hudHit(e.clientX,e.clientY);
  if(h==='pause'){togglePause();return}
  if(h==='boost'){boostHeld=true;boostPtr=e.pointerId;buzz(15);return}
  if(joy.id!==null)return; // one pointer steers (thumb or mouse drag)
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  joy.id=e.pointerId;joy.active=true;joy.bx=joy.kx=e.clientX;joy.by=joy.ky=e.clientY;joy.mag=0;
});
function ptrUp(e){
  if(e.pointerId===boostPtr){boostHeld=false;boostPtr=null;return}
  if(e.pointerId===joy.id){joy.id=null;joy.active=false;joy.mag=0;return}
}
cv.addEventListener('pointerup',ptrUp);cv.addEventListener('pointercancel',ptrUp);

// menu
const sw=document.getElementById('swatches');
COLORS.forEach((c,i)=>{const d=document.createElement('div');d.className='sw'+(i===0?' sel':'');d.style.background=c;
  d.onclick=()=>{myColor=c;[...sw.children].forEach(x=>x.classList.remove('sel'));d.classList.add('sel')};sw.appendChild(d)});
document.getElementById('playBtn').onclick=()=>{myName=(document.getElementById('nameIn').value.trim()||'You');startGame()};
document.getElementById('againBtn').onclick=()=>startGame();

// ---------- logic ----------
function playerSteer(b,dt){
  let ax=0,ay=0;
  if(keys['a']||keys['arrowleft'])ax-=1;if(keys['d']||keys['arrowright'])ax+=1;
  if(keys['w']||keys['arrowup'])ay-=1;if(keys['s']||keys['arrowdown'])ay+=1;
  let want=null;
  if(ax||ay)want=Math.atan2(ay,ax);
  else if(joy.active&&joy.mag>.18)want=joy.ang;
  else if(pointer.active){
    const dx=pointer.x-cw/2,dy=pointer.y-ch/2;
    if(Math.hypot(dx,dy)>28)want=Math.atan2(dy,dx);
  }
  if(want!==null)b.ang+=clamp(angDiff(b.ang,want),-3.4*dt,3.4*dt);
  b.boosting=boostHeld;
}

function botSteer(b,dt){
  const full=b.riders.length>=b.cap*.85||(timeLeft<14&&b.riders.length>0);
  b.retarget-=dt;
  if(full){b.target={x:b.depot.x,y:b.depot.y}}
  else if(b.retarget<=0){
    b.retarget=rnd(.25,.6);
    let best=null,bd=1e9;
    for(const p of pass){
      const d=Math.hypot(p.x-b.x,p.y-b.y)-p.v*40+Math.abs(angDiff(b.ang,Math.atan2(p.y-b.y,p.x-b.x)))*60;
      if(d<bd){bd=d;best=p}
    }
    b.target=best?{x:best.x,y:best.y}:{x:WORLD/2,y:WORLD/2};
  }
  let tx=b.target.x-b.x,ty=b.target.y-b.y;
  const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
  // avoid other bus bodies
  for(const o of buses){
    if(o===b)continue;
    const list=[{x:o.x,y:o.y},...o.parts];
    for(const p of list){
      const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy);
      if(d<110&&d>1){
        const ahead=(Math.cos(b.ang)*-dx+Math.sin(b.ang)*-dy)>0;
        if(ahead){const k=(110-d)/110*1.8;tx+=dx/d*k;ty+=dy/d*k}
      }
    }
  }
  // stay off the walls
  const m=220;
  if(b.x<m)tx+=(m-b.x)/m*2;if(b.x>WORLD-m)tx-=(b.x-(WORLD-m))/m*2;
  if(b.y<m)ty+=(m-b.y)/m*2;if(b.y>WORLD-m)ty-=(b.y-(WORLD-m))/m*2;
  b.ang+=clamp(angDiff(b.ang,Math.atan2(ty,tx)),-3*dt,3*dt);
  b.boosting=b.stamina>.6&&Math.abs(angDiff(b.ang,Math.atan2(ty,tx)))<.2&&Math.hypot(b.target.x-b.x,b.target.y-b.y)>500&&b.idx%2===0;
}

// shrink a bus to `carriages` carriages; riders over the new capacity spill out
function shrink(b,carriages,label){
  const lost=b.carriages-carriages;
  b.carriages=carriages;b.delivered=(carriages-1)*CAP_PER_CARRIAGE;
  // riders over the new capacity are left on the road, free for anyone to grab
  const spots=[{x:b.x,y:b.y},...b.parts];
  let n=0;
  while(b.riders.length>b.cap){
    const v=b.riders.pop();n++;
    const s=spots[(Math.random()*spots.length)|0],a=Math.random()*6.28,r=rnd(10,60);
    spawnPassenger(clamp(s.x+Math.cos(a)*r,30,WORLD-30),clamp(s.y+Math.sin(a)*r,30,WORLD-30),v);
    const p=pass[pass.length-1];p.vx=Math.cos(a)*rnd(60,160);p.vy=Math.sin(a)*rnd(60,160);
  }
  b.noPick=1.8; // dropper can't instantly re-grab them
  if(n)floats.push({x:b.x,y:b.y+30,t:1.4,txt:`${n} left behind!`,c:'#ffd23f'});
  b.stun=1;b.inv=2.2;b.speed=0;
  b.ang+=Math.PI*.75*(Math.random()<.5?1:-1);
  for(let i=0;i<14;i++)parts.push({x:b.x,y:b.y,vx:rnd(-260,260),vy:rnd(-260,260),life:.6,c:'#ffd23f'});
  floats.push({x:b.x,y:b.y-30,t:1.2,txt:lost>0?`${label} -${lost*CAP_PER_CARRIAGE} cap 💥`:'BONK!',c:'#ff6b6b'});
  if(b===player){beep(120,.25,'sawtooth',.09,-60);buzz([60,40,90])}
}
// head hits another bus's body -> back to initial capacity
function crash(b){shrink(b,1,'CRASH')}

function update(dt){
  if(state==='count'){countdown-=dt;if(countdown<=0){state='play';beep(880,.25,'square',.06)}}
  const live=state==='play';
  if(live){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;endGame();return}}

  for(const b of buses){
    b.inv=Math.max(0,b.inv-dt);b.stun=Math.max(0,b.stun-dt);
    if(live){b.human?playerSteer(b,dt):botSteer(b,dt)}
    // speed
    let sp=235;
    if(b.boosting&&b.stamina>0&&b.stun<=0){sp=370;b.stamina=Math.max(0,b.stamina-dt*.55)}
    else{b.stamina=Math.min(1,b.stamina+dt*.22);if(b.stamina<=0)b.boosting=false}
    if(b.stun>0)sp*=.25;
    if(!live)sp=0;
    b.speed+=(sp-b.speed)*Math.min(1,dt*6);
    b.x+=Math.cos(b.ang)*b.speed*dt;b.y+=Math.sin(b.ang)*b.speed*dt;
    // walls
    const M=34;
    if(b.x<M||b.x>WORLD-M||b.y<M||b.y>WORLD-M){
      b.x=clamp(b.x,M,WORLD-M);b.y=clamp(b.y,M,WORLD-M);
      if(b.human){const to=Math.atan2(WORLD/2-b.y,WORLD/2-b.x);if(Math.abs(angDiff(b.ang,to))>1.4)b.ang+=clamp(angDiff(b.ang,to),-4*dt,4*dt)}
    }
    // trail
    const t0=b.trail[0];
    if(Math.hypot(b.x-t0.x,b.y-t0.y)>=6){b.trail.unshift({x:b.x,y:b.y});if(b.trail.length>170)b.trail.pop()}
    b.computeParts();

    // pickup
    b.noPick=Math.max(0,(b.noPick||0)-dt);
    if(live&&b.stun<=0&&b.noPick<=0&&b.riders.length<b.cap){
      const pr=36+b.carriages*2;
      for(let i=pass.length-1;i>=0;i--){
        const p=pass[i],dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy);
        if(d<pr+50){p.x+=dx/d*Math.min(d,380*dt);p.y+=dy/d*Math.min(d,380*dt)}
        if(d<26){
          if(b.riders.length>=b.cap)break;
          b.riders.push(p.v);pass.splice(i,1);
          if(b.human)beep(520+b.riders.length*14,.06,'sine',.05);
        }
      }
    }
    // unload
    const inDepot=Math.hypot(b.x-b.depot.x,b.y-b.depot.y)<95;
    if(live&&inDepot&&b.riders.length){
      b.unloadT-=dt;
      while(b.unloadT<=0&&b.riders.length){
        b.unloadT+=.05;
        const v=b.riders.pop();b.score+=v;b.delivered+=1;
        floats.push({x:b.depot.x+rnd(-40,40),y:b.depot.y-40+rnd(-10,10),t:.9,txt:'+'+v,c:v>1?'#ffd23f':'#fff'});
        for(let i=0;i<3;i++)parts.push({x:b.depot.x,y:b.depot.y,vx:rnd(-200,200),vy:rnd(-300,-60),life:.7,c:b.color});
        if(b.human)beep(700+Math.min(500,b.delivered*8),.07,'triangle',.06);
        const nc=Math.min(11,1+Math.floor(b.delivered/CAP_PER_CARRIAGE));
        if(nc>b.carriages){b.carriages=nc;floats.push({x:b.x,y:b.y-50,t:1.3,txt:'BIGGER BUS! 🚌',c:'#7dffb0'});if(b.human)beep(400,.3,'square',.07,500)}
      }
    }else b.unloadT=0;
  }

  // bus vs bus bodies
  if(live){
    for(const a of buses){
      if(a.inv>0)continue;
      for(const o of buses){
        if(o===a)continue;
        let hit=false;
        for(const p of o.parts){if(Math.hypot(a.x-p.x,a.y-p.y)<30){hit=true;break}}
        if(!hit&&Math.hypot(a.x-o.x,a.y-o.y)<30&&o.inv<=0){ // head-on: both bounce
          // head-on: both lose half their carriages
          const to=Math.atan2(a.y-o.y,a.x-o.x);
          shrink(a,Math.max(1,Math.ceil(a.carriages/2)),'HEAD-ON');
          shrink(o,Math.max(1,Math.ceil(o.carriages/2)),'HEAD-ON');
          a.ang=to;o.ang=to+Math.PI;
          beep(160,.12,'square',.06);continue;
        }
        if(hit){crash(a);break}
      }
    }
  }

  // refill passengers
  let missing=MAX_PASS-pass.length;
  while(missing-->0&&Math.random()<.5)spawnPassenger();
  for(const p of pass){
    p.ph+=dt*4;
    if(p.vx||p.vy){p.x=clamp(p.x+p.vx*dt,30,WORLD-30);p.y=clamp(p.y+p.vy*dt,30,WORLD-30);p.vx*=.9;p.vy*=.9;if(Math.abs(p.vx)+Math.abs(p.vy)<5)p.vx=p.vy=0}
  }

  // fx
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t-=dt;f.y-=40*dt;if(f.t<=0)floats.splice(i,1)}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;if(p.life<=0)parts.splice(i,1)}

  // camera
  // portrait-first: ~600 world px across the screen width; camera is hard-locked to the player's bus
  const base=ch>cw?cw/600:ch/760;
  const tz=base*(1-player.carriages*.016);
  cam.z+=(tz-cam.z)*Math.min(1,dt*3);
  cam.x=player.x;cam.y=player.y;
}

// ---------- drawing ----------
function hash(x,y){let h=(x*73856093)^(y*19349663);h=(h^(h>>>13))*1274126177;return (h^(h>>>16))>>>0}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function mkrng(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
function tree(x,y,r){
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(x+r*.4,y+r*.9,r*.95,r*.55,0,0,7);ctx.fill();
  ctx.fillStyle='#6b4a2f';ctx.fillRect(x-r*.14,y+r*.2,r*.28,r*.7);
  ctx.fillStyle='#2f9a52';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.fillStyle='#46bb64';ctx.beginPath();ctx.arc(x-r*.12,y-r*.15,r*.8,0,7);ctx.fill();
  ctx.fillStyle='#7ddc8a';ctx.beginPath();ctx.arc(x-r*.3,y-r*.35,r*.35,0,7);ctx.fill();
}
function lamp(x,y){
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x+3,y+14,6,3,0,0,7);ctx.fill();
  ctx.fillStyle='#2b2f3d';ctx.fillRect(x-2.5,y-10,5,24);
  ctx.fillStyle='#ffd966';ctx.beginPath();ctx.arc(x,y-14,6,0,7);ctx.fill();
}
const ROOFS=[['#a07be0','#6c4bb0'],['#ee917d','#b85f4c'],['#62c9b6','#3b8f80'],['#5c93f0','#3a62b8'],['#9a9ca8','#666874']];

function drawWorld(vx0,vy0,vx1,vy1){
  ctx.fillStyle='#363d5c';ctx.fillRect(0,0,WORLD,WORLD);
  const gx0=Math.max(0,Math.floor(vx0/CELL)),gx1=Math.min(WORLD/CELL-1,Math.floor(vx1/CELL));
  const gy0=Math.max(0,Math.floor(vy0/CELL)),gy1=Math.min(WORLD/CELL-1,Math.floor(vy1/CELL));
  ctx.strokeStyle='rgba(170,182,225,.45)';ctx.lineWidth=4;ctx.setLineDash([34,26]);
  ctx.beginPath();
  for(let g=0;g<=WORLD/CELL;g++){ctx.moveTo(g*CELL,0);ctx.lineTo(g*CELL,WORLD);ctx.moveTo(0,g*CELL);ctx.lineTo(WORLD,g*CELL)}
  ctx.stroke();ctx.setLineDash([]);
  for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){
    const h=hash(gx,gy),rnd=mkrng(h),bx=gx*CELL+ROAD/2,by=gy*CELL+ROAD/2,bs=CELL-ROAD;
    const kind=h%5;
    // raised sidewalk tile
    ctx.fillStyle='#737a92';rr(bx,by+12,bs,bs,32);ctx.fill();
    ctx.fillStyle='#cfd3de';rr(bx,by,bs,bs,32);ctx.fill();
    ctx.fillStyle='#e2e5ee';rr(bx+8,by+8,bs-16,bs-16,26);ctx.fill();
    if(kind<2){ // park
      ctx.fillStyle='#4fae5f';rr(bx+16,by+16,bs-32,bs-32,22);ctx.fill();
      ctx.fillStyle='#63c273';rr(bx+16,by+16,bs-32,bs-42,22);ctx.fill();
      for(let i=0;i<7;i++)tree(bx+45+rnd()*(bs-90),by+45+rnd()*(bs-90),19+rnd()*8);
    }else if(kind<4){ // buildings (3D blocks)
      const sz=bs/2-34;
      for(let i=0;i<4;i++){
        const cx=bx+22+(i%2)*(bs/2-6),cy=by+22+(i>>1)*(bs/2-6),c=ROOFS[(h>>>(i*3))%5];
        ctx.fillStyle='rgba(0,0,0,.18)';rr(cx+4,cy+18,sz,sz,14);ctx.fill();
        ctx.fillStyle=c[1];rr(cx,cy+14,sz,sz,14);ctx.fill();
        ctx.fillStyle=c[0];rr(cx,cy,sz,sz,14);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.2)';rr(cx+12,cy+12,sz-24,sz-24,8);ctx.fill();
      }
      for(let i=0;i<3;i++){const side=(rnd()*4)|0,t=rnd();
        const tx=side===0?bx+16:side===1?bx+bs-16:bx+30+t*(bs-60),ty=side===2?by+16:side===3?by+bs-16:by+30+t*(bs-60);
        tree(tx,ty,13+rnd()*5)}
      lamp(bx+14,by+bs-14);lamp(bx+bs-14,by+14);
    }else{ // plaza with fountain
      ctx.fillStyle='#ead9a8';rr(bx+16,by+16,bs-32,bs-32,22);ctx.fill();
      const fx=bx+bs/2,fy=by+bs/2;
      ctx.fillStyle='#3f7fb8';ctx.beginPath();ctx.arc(fx,fy+8,56,0,7);ctx.fill();
      ctx.fillStyle='#78cdf5';ctx.beginPath();ctx.arc(fx,fy,56,0,7);ctx.fill();
      ctx.fillStyle='#bdeaff';ctx.beginPath();ctx.arc(fx,fy,32,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(fx,fy,9,0,7);ctx.fill();
      tree(bx+36,by+36,17);tree(bx+bs-36,by+bs-36,17);lamp(bx+bs-30,by+34);
    }
  }
  ctx.strokeStyle='#ff5d5d';ctx.lineWidth=14;ctx.strokeRect(0,0,WORLD,WORLD);
}

function drawDepot(b,t){
  const {x,y}=b.depot;
  ctx.fillStyle=b.color;ctx.globalAlpha=.3;ctx.beginPath();ctx.arc(x,y,95,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle=b.color;ctx.lineWidth=8;ctx.setLineDash([20,14]);
  ctx.lineDashOffset=-t*30;ctx.beginPath();ctx.arc(x,y,95,0,7);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#fff';ctx.font='bold 22px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('DEPOT',x,y-8);
  ctx.font='bold 16px "Trebuchet MS",sans-serif';ctx.fillText(b.name,x,y+16);
}

function drawPassenger(p,t){
  if(p.v>1){ // glowing gold coin
    const r=13+Math.sin(t*5+p.ph)*1.5;
    const g=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,r*2.3);
    g.addColorStop(0,'rgba(255,215,70,.85)');g.addColorStop(1,'rgba(255,200,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r*2.3,0,7);ctx.fill();
    ctx.fillStyle='#c98a00';ctx.beginPath();ctx.arc(p.x,p.y+2,r+1,0,7);ctx.fill();
    ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();
    ctx.fillStyle='#fff4b0';ctx.beginPath();ctx.arc(p.x-r*.3,p.y-r*.3,r*.4,0,7);ctx.fill();
    return;
  }
  const bob=Math.sin(p.ph)*1.5;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(p.x+2,p.y+10,8,4,0,0,7);ctx.fill();
  ctx.fillStyle=p.c;rr(p.x-6.5,p.y-3+bob,13,14,6);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.18)';rr(p.x-6.5,p.y+4+bob,13,7,4);ctx.fill();
  ctx.fillStyle='#ffd9b8';ctx.beginPath();ctx.arc(p.x,p.y-8+bob,6.5,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(p.x-2,p.y-10+bob,2,0,7);ctx.fill();
}

function drawBusPiece(x,y,a,color,isHead,flash){
  const L=isHead?66:58,Wd=34,fill=flash?'#ffffff':color;
  // ground shadow
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.save();ctx.translate(x+6,y+16);ctx.rotate(a);rr(-L/2,-Wd/2,L,Wd,10);ctx.fill();ctx.restore();
  // extruded lower body (offset in screen space so it always reads as "height")
  ctx.save();ctx.translate(x,y+9);ctx.rotate(a);
  ctx.fillStyle='#14141c';ctx.fillRect(-L/2+8,-Wd/2-3,13,6);ctx.fillRect(-L/2+8,Wd/2-3,13,6);ctx.fillRect(L/2-21,-Wd/2-3,13,6);ctx.fillRect(L/2-21,Wd/2-3,13,6);
  ctx.fillStyle=fill;rr(-L/2,-Wd/2,L,Wd,10);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.45)';rr(-L/2,-Wd/2,L,Wd,10);ctx.fill();
  ctx.restore();
  // roof
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  ctx.fillStyle=fill;rr(-L/2,-Wd/2,L,Wd,10);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.28)';rr(-L/2+3,-Wd/2+2,L-6,Wd/2-2,8);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=2;rr(-L/2,-Wd/2,L,Wd,10);ctx.stroke();
  // roof panel
  ctx.fillStyle='rgba(255,255,255,.22)';rr(-L/2+8,-Wd/2+6,L-24,Wd-12,6);ctx.fill();
  // side windows
  ctx.fillStyle='#27406e';
  const n=3,seg=(L-24)/n;
  for(let i=0;i<n;i++){ctx.fillRect(-L/2+9+i*seg,-Wd/2+1.5,seg-3,4);ctx.fillRect(-L/2+9+i*seg,Wd/2-5.5,seg-3,4)}
  if(isHead){
    ctx.fillStyle='#27406e';rr(L/2-14,-Wd/2+4,9,Wd-8,3);ctx.fill();
    ctx.fillStyle='#fff7a8';ctx.beginPath();ctx.arc(L/2-2,-Wd/2+7,3.5,0,7);ctx.arc(L/2-2,Wd/2-7,3.5,0,7);ctx.fill();
  }else{ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-L/2-4,-3,6,6)}
  ctx.restore();
}

function drawBus(b,t){
  const flash=b.inv>0&&Math.floor(t*14)%2===0;
  for(let i=b.parts.length-1;i>=0;i--)drawBusPiece(b.parts[i].x,b.parts[i].y,b.parts[i].a,b.color,false,flash);
  drawBusPiece(b.x,b.y,b.ang,b.color,true,flash);
  if(b.boosting&&b.stamina>0){ctx.fillStyle='rgba(255,170,0,.8)';
    for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(b.x-Math.cos(b.ang)*(44+i*10)+rnd(-4,4),b.y-Math.sin(b.ang)*(44+i*10)+rnd(-4,4),7-i*2,0,7);ctx.fill()}}
}
function drawBusLabel(b){
  const txt=`${b.human?'You':b.name} ${b.riders.length}/${b.cap}`;
  ctx.font='bold 17px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(txt).width+24,x=b.x-w/2,y=b.y-76;
  ctx.fillStyle='rgba(20,28,66,.82)';rr(x,y,w,28,14);ctx.fill();
  ctx.fillStyle='rgba(20,28,66,.82)';ctx.beginPath();ctx.moveTo(b.x-7,y+27);ctx.lineTo(b.x+7,y+27);ctx.lineTo(b.x,y+36);ctx.fill();
  ctx.fillStyle=b.riders.length>=b.cap?'#ffcf33':'#fff';ctx.fillText(txt,b.x,y+15);
}

// ---------- HUD (designed on a 941x1672 portrait canvas, scaled to fit) ----------
function hudScale(){return Math.min(cw,ch*0.5625)/941}
function polyRound(p,r){
  const n=p.length;ctx.beginPath();
  ctx.moveTo((p[0][0]+p[n-1][0])/2,(p[0][1]+p[n-1][1])/2);
  for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];ctx.arcTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2,r)}
  ctx.closePath();
}
function navyPanel(pts,r,border){
  polyRound(pts,r);
  const ys=pts.map(p=>p[1]),g=ctx.createLinearGradient(0,Math.min(...ys),0,Math.max(...ys));
  g.addColorStop(0,'#1d3a82');g.addColorStop(1,'#0f2255');
  ctx.fillStyle=g;ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=border||'#2f80ff';ctx.stroke();
}
function bar(x,y,w,h,frac,col1,col2){
  ctx.fillStyle='#091236';rr(x,y,w,h,h/2);ctx.fill();
  const fw=Math.max(h,w*clamp(frac,0,1));
  const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,col1);g.addColorStop(1,col2);
  ctx.fillStyle=g;rr(x,y,fw,h,h/2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';rr(x+6,y+3,Math.max(0,fw-12),h/4,4);ctx.fill();
}
function txt(s,x,y,size,col,align){
  ctx.font=`bold ${size}px "Trebuchet MS",Verdana,sans-serif`;ctx.textAlign=align||'left';ctx.textBaseline='middle';
  ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);
}
function crown(x,y,sc){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.fillStyle='#ffc61a';ctx.beginPath();ctx.moveTo(-15,10);ctx.lineTo(-17,-8);ctx.lineTo(-7,0);ctx.lineTo(0,-12);ctx.lineTo(7,0);ctx.lineTo(17,-8);ctx.lineTo(15,10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff9d00';ctx.fillRect(-15,6,30,5);ctx.restore();
}

function drawHUD(t){
  const s=hudScale(),load=player.riders.length,cap=player.cap;
  const all=buses.slice().sort((a,b)=>b.score-a.score);

  // --- top-left: riders + boost
  ctx.save();ctx.scale(s,s);
  navyPanel([[20,20],[325,20],[360,200],[20,200]],26);
  ctx.fillStyle='#2f6dd6';ctx.beginPath();ctx.arc(70,68,36,0,7);ctx.fill();
  ctx.strokeStyle='#6aa6ff';ctx.lineWidth=4;ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(70,56,10,0,7);ctx.fill();ctx.beginPath();ctx.arc(70,84,17,Math.PI,0);ctx.fill();
  ctx.beginPath();ctx.arc(50,62,7,0,7);ctx.fill();ctx.beginPath();ctx.arc(90,62,7,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(50,82,11,Math.PI,0);ctx.fill();ctx.beginPath();ctx.arc(90,82,11,Math.PI,0);ctx.fill();
  txt('Riders',124,47,25,'#fff');
  txt(`${load}/${cap}`,124,84,40,load>=cap?'#ffd23f':'#fff');
  bar(42,112,266,26,load/cap,'#ffe066','#ffb703');
  // boost
  ctx.fillStyle='#ffc61a';ctx.beginPath();ctx.moveTo(60,152);ctx.lineTo(42,174);ctx.lineTo(54,174);ctx.lineTo(48,194);ctx.lineTo(68,168);ctx.lineTo(55,168);ctx.closePath();ctx.fill();
  txt('BOOST',76,172,23,'#fff');
  bar(158,159,180,26,player.stamina,'#ffa23a','#ff7a00');
  ctx.restore();

  // --- top-center: timer
  ctx.save();ctx.translate(cw/2-477*s,0);ctx.scale(s,s);
  navyPanel([[352,20],[602,20],[602,115],[352,115]],47);
  ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(400,72,28,0,7);ctx.fill();
  ctx.fillRect(394,36,12,8);
  ctx.fillStyle='#14275f';ctx.beginPath();ctx.arc(400,72,20,0,7);ctx.fill();
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(400,72);ctx.lineTo(400,58);ctx.moveTo(400,72);ctx.lineTo(410,76);ctx.stroke();
  const sec=Math.ceil(timeLeft);
  txt(`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`,458,68,58,timeLeft<15?'#ff7b7b':'#fff');
  ctx.restore();

  // --- top-right: leaderboard
  ctx.save();ctx.translate(cw-941*s,0);ctx.scale(s,s);
  const rows=all.slice(0,8);if(!rows.includes(player))rows.push(player);
  navyPanel([[612,102],[920,102],[920,102+rows.length*42+25],[612,102+rows.length*42+25]],26);
  rows.forEach((b,i)=>{
    const y=133+i*42,rank=all.indexOf(b)+1,me=b===player;
    if(me){ctx.fillStyle='rgba(255,190,0,.3)';rr(620,y-20,292,40,14);ctx.fill();ctx.strokeStyle='#ffc61a';ctx.lineWidth=4;ctx.stroke()}
    if(rank===1){crown(643,y,1.0)}
    else{ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(645,y,12,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.stroke()}
    txt(`${rank}.`,672,y,25,rank===1?'#ffd23f':b.color);
    txt(b.human?'You':b.name,712,y,25,me?'#ffd23f':'#fff');
    txt(String(b.score),892,y,27,me?'#ffd23f':'#fff','right');
  });
  ctx.restore();

  // --- bottom-left: local minimap
  ctx.save();ctx.translate(0,ch-1672*s);ctx.scale(s,s);
  const MX=20,MY=1422,MW=256,MH=223,cx=MX+MW/2,cy=MY+MH/2,mk=.26;
  polyRound([[MX,MY],[MX+MW,MY],[MX+MW,MY+MH],[MX,MY+MH]],34);
  ctx.fillStyle='#0a1436';ctx.fill();
  ctx.save();ctx.clip();
  ctx.strokeStyle='#17275f';ctx.lineWidth=ROAD*mk;
  const hx=MW/2/mk,hy=MH/2/mk;
  ctx.beginPath();
  for(let g=Math.floor((player.x-hx)/CELL);g<=Math.ceil((player.x+hx)/CELL);g++){const sx=cx+(g*CELL-player.x)*mk;ctx.moveTo(sx,MY);ctx.lineTo(sx,MY+MH)}
  for(let g=Math.floor((player.y-hy)/CELL);g<=Math.ceil((player.y+hy)/CELL);g++){const sy=cy+(g*CELL-player.y)*mk;ctx.moveTo(MX,sy);ctx.lineTo(MX+MW,sy)}
  ctx.stroke();
  for(const p of pass){
    const dx=(p.x-player.x)*mk,dy=(p.y-player.y)*mk;
    if(Math.abs(dx)>MW/2||Math.abs(dy)>MH/2)continue;
    ctx.fillStyle=p.v>1?'#ffd23f':p.c;ctx.beginPath();ctx.arc(cx+dx,cy+dy,p.v>1?8:5,0,7);ctx.fill();
  }
  for(const b of buses){
    if(b===player)continue;
    const dx=(b.x-player.x)*mk,dy=(b.y-player.y)*mk;
    if(Math.abs(dx)>MW/2||Math.abs(dy)>MH/2)continue;
    ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(cx+dx,cy+dy,11,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
  }
  // own depot
  {const dx=clamp((player.depot.x-player.x)*mk,-MW/2+18,MW/2-18),dy=clamp((player.depot.y-player.y)*mk,-MH/2+18,MH/2-18);
   ctx.strokeStyle='#ffd23f';ctx.lineWidth=5;ctx.beginPath();ctx.arc(cx+dx,cy+dy,13,0,7);ctx.stroke();
   ctx.fillStyle='#ffd23f';ctx.fillRect(cx+dx-4,cy+dy-4,8,8)}
  ctx.save();ctx.translate(cx,cy);ctx.rotate(player.ang);
  ctx.fillStyle='#ffc61a';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(-14,-16);ctx.lineTo(-6,0);ctx.lineTo(-14,16);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  ctx.restore();
  polyRound([[MX,MY],[MX+MW,MY],[MX+MW,MY+MH],[MX,MY+MH]],34);ctx.lineWidth=6;ctx.strokeStyle='#2f80ff';ctx.stroke();
  ctx.restore();

  // --- bottom-center: "Go to your depot" banner
  if(load>=cap&&state!=='end'){
    ctx.save();ctx.translate(cw/2-470*s,ch-1672*s);ctx.scale(s,s);
    const pulse=1+Math.sin(t*6)*.025;ctx.translate(470,1576);ctx.scale(pulse,pulse);ctx.translate(-470,-1576);
    navyPanel([[316,1532],[630,1532],[676,1576],[630,1620],[316,1620]],22,'#ffc61a');
    ctx.fillStyle='#ffc61a';ctx.beginPath();ctx.arc(358,1576,30,0,7);ctx.fill();
    txt('!',358,1578,40,'#14275f','center');
    txt('Go to your depot',408,1577,33,'#fff');
    ctx.restore();
  }

  // --- bottom-right: pause
  ctx.save();ctx.translate(cw-941*s,ch-1672*s);ctx.scale(s,s);
  ctx.fillStyle='#14275f';ctx.beginPath();ctx.arc(866,1576,50,0,7);ctx.fill();ctx.lineWidth=6;ctx.strokeStyle='#2f80ff';ctx.stroke();
  ctx.fillStyle='#fff';
  if(state==='paused'){ctx.beginPath();ctx.moveTo(851,1553);ctx.lineTo(886,1576);ctx.lineTo(851,1599);ctx.closePath();ctx.fill()}
  else{rr(848,1554,14,44,5);ctx.fill();rr(872,1554,14,44,5);ctx.fill()}
  ctx.restore();

  // floating joystick (screen space, fades in/out)
  joy.alpha+=((joy.active?1:0)-joy.alpha)*.25;
  if(joy.alpha>.02){
    const R=joyR();ctx.save();ctx.globalAlpha=joy.alpha;
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.arc(joy.bx,joy.by,R,0,7);ctx.fill();
    ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.5)';ctx.stroke();
    ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.arc(joy.bx,joy.by,R*.55,0,7);ctx.stroke();
    if(joy.mag>.18){ // direction chevron on the rim
      ctx.save();ctx.translate(joy.bx,joy.by);ctx.rotate(joy.ang);ctx.fillStyle='rgba(255,255,255,.75)';
      ctx.beginPath();ctx.moveTo(R+12,0);ctx.lineTo(R-4,-9);ctx.lineTo(R-4,9);ctx.closePath();ctx.fill();ctx.restore();
    }
    const g=ctx.createRadialGradient(joy.kx-6,joy.ky-8,2,joy.kx,joy.ky,R*.46);
    g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(190,210,255,.7)');
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.arc(joy.kx+2,joy.ky+5,R*.42,0,7);ctx.fill();
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(joy.kx,joy.ky,R*.42,0,7);ctx.fill();
    ctx.restore();
  }

  // countdown / paused
  if(state==='count'){
    const n=Math.ceil(countdown-.4);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 120px "Trebuchet MS",sans-serif';ctx.lineWidth=10;ctx.strokeStyle='#0a1436';
    const tx=n>0?String(n):'GO!';ctx.strokeText(tx,cw/2,ch/2);ctx.fillStyle='#ffd23f';ctx.fillText(tx,cw/2,ch/2);
  }
  if(state==='paused'){
    ctx.fillStyle='rgba(8,14,40,.6)';ctx.fillRect(0,0,cw,ch);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 64px "Trebuchet MS",sans-serif';ctx.lineWidth=8;ctx.strokeStyle='#0a1436';
    ctx.strokeText('PAUSED',cw/2,ch/2);ctx.fillStyle='#ffd23f';ctx.fillText('PAUSED',cw/2,ch/2);
    ctx.font='bold 20px "Trebuchet MS",sans-serif';ctx.fillStyle='#fff';ctx.fillText('tap the button to resume',cw/2,ch/2+50);
  }
}

let T=0;
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#20232b';ctx.fillRect(0,0,cw,ch);
  if(!player){ // menu backdrop
    ctx.fillStyle='#3a3f4b';ctx.fillRect(0,0,cw,ch);return;
  }
  const z=cam.z;
  ctx.save();
  ctx.translate(cw/2,ch/2);ctx.scale(z,z);ctx.translate(-cam.x,-cam.y);
  const vx0=cam.x-cw/2/z-80,vx1=cam.x+cw/2/z+80,vy0=cam.y-ch/2/z-80,vy1=cam.y+ch/2/z+80;
  drawWorld(vx0,vy0,vx1,vy1);
  for(const b of buses)drawDepot(b,T);
  for(const p of pass)if(p.x>vx0&&p.x<vx1&&p.y>vy0&&p.y<vy1)drawPassenger(p,T);
  for(const b of buses)drawBus(b,T);
  if(state!=='end'&&player.riders.length>=player.cap){ // small chevron pointing home when full
    const a=Math.atan2(player.depot.y-player.y,player.depot.x-player.x),d=120+Math.sin(T*8)*6;
    ctx.save();ctx.translate(player.x+Math.cos(a)*d,player.y+Math.sin(a)*d);ctx.rotate(a);
    ctx.fillStyle='#ffc61a';ctx.strokeStyle='#14275f';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(-12,-16);ctx.lineTo(-4,0);ctx.lineTo(-12,16);ctx.closePath();ctx.stroke();ctx.fill();ctx.restore();
  }
  for(const b of buses)if(b.x>vx0&&b.x<vx1&&b.y>vy0&&b.y<vy1)drawBusLabel(b);
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life*1.5);ctx.fillStyle=p.c;ctx.fillRect(p.x-3,p.y-3,6,6)}
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.font='bold 26px "Trebuchet MS",sans-serif';
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.t*2);ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y)}
  ctx.globalAlpha=1;
  ctx.restore();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawHUD(T);
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  if(player&&(state==='play'||state==='count'))update(dt);
  else if(player&&state==='end'){ // keep world alive behind results
    for(const f of floats)f.t-=dt;
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// test hook
window.__game={crash,endGame,joy,get state(){return state},get buses(){return buses},get pass(){return pass}};
})();
</script>
</body>
