<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acorn Rings</title>
<style>
:root{--bg1:#fff3b0;--bg2:#ffd96a;--fg:#5a3a12;--card:#fffbea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#4a3a14;--bg2:#2e2410;--fg:#ffe9a8;--card:#3b2f14}}
:root[data-theme="dark"]{--bg1:#4a3a14;--bg2:#2e2410;--fg:#ffe9a8;--card:#3b2f14}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2));color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:none}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-weight:800}
h1{font-size:22px;margin:0}
#wrap{flex:1;position:relative;min-height:0}
canvas{width:100%;height:100%;display:block}
footer{display:flex;gap:10px;justify-content:center;padding:12px 18px 18px}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:12px 22px;background:#22a06b;color:#fff;cursor:pointer;box-shadow:0 4px 0 #157a50}
button.alt{background:var(--card);color:var(--fg);box-shadow:0 4px 0 #0002}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
#ov div{pointer-events:auto;background:var(--card);padding:24px 34px;border-radius:20px;text-align:center;box-shadow:0 10px 30px #0004}
#ov h2{margin:0 0 6px}#ov p{margin:0 0 16px;opacity:.8}
#sel{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg2);z-index:5;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#sh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:18px}
#grid{flex:1;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;padding:6px 18px 24px;align-content:start}
.lv{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0;min-height:52px;background:var(--card);color:var(--fg);box-shadow:0 3px 0 #0002;font-size:16px}
.lv small{font-size:10px;color:#e0a000;min-height:12px}.lv.cur{outline:3px solid #22a06b}
#tip{text-align:center;font-size:13px;opacity:.75;padding:0 18px}
</style></head><body>
<header><h1>Acorn Rings</h1><span id="lv">Level 1</span><span id="mv">Moves: 0</span></header>
<div id="tip">Drag a ring until its gap reaches the green clamp. Dotted-arc rings (D-rings) can only turn within that range.</div>
<div id="wrap"><canvas id="c"></canvas>
<div id="ov"><div><h2>Level cleared!</h2><p id="res"></p><button id="nx">Next level</button></div></div></div>
<footer><button class="alt" id="hint">Hint</button><button class="alt" id="lb">Levels</button><button class="alt" id="rs">Restart</button><button class="alt" id="mu">Sound: on</button></footer>
<div id="sel"><div id="sh"><b>Select level</b><button class="alt" id="cl">Close</button></div><div id="grid"></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const COLS=['#ef4444','#3b82f6','#a855f7','#f97316','#14b8a6','#ec4899'],STEP=15,HALF=30;
const TOTAL=200;
let level=1,sats=[],moves=0,drag=null,won=false,winT=0,W=0,H=0,cx=0,cy=0,S=1,conf=[],shake=0,shakeI=-1;
try{level=+localStorage.getItem('ar_level')||1}catch(e){}
level=Math.max(1,Math.min(TOTAL,level));
function mb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rs=null,tier=0;const rf=()=>rs?rs():Math.random();
const rnd=n=>Math.floor(rf()*n),norm=a=>((a%360)+360)%360,rad=a=>a*Math.PI/180;
let mode='hub',par=1,edges=[];
const POOLS=[[[2,1],[1,2],[3]],[[1,2,1],[4]],[[2,3],[3,2],[5],[2,1,2]],[[1,2,3],[3,2,1],[1,2,1,2]],[[2,3,2],[3,4],[1,2,3,2]],[[1,2,3,2],[3,2,3],[2,3,2,3]],[[1,2,3,4],[4,3,2,1],[2,3,4]],[[3,4,3],[1,2,3,2,1],[2,3,4,3]],[[2,3,4,3,2],[1,2,3,4,3]],[[3,4,5,4,3],[1,2,3,4,3,2],[2,3,4,5,4]]];
function buildPy(){
  document.getElementById('tip').textContent='Rings are clamped together. Rotate a ring until its gap sits on a clamp to release it. Free every ring to win.';
  const pool=POOLS[Math.min(tier,9)],rows=pool[rnd(pool.length)],pts=[];
  rows.forEach((m,w)=>{for(let c=0;c<m;c++)pts.push({x:c-(m-1)/2,y:(w-(rows.length-1)/2)*.866})});
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const ex=(Math.max(...xs)-Math.min(...xs))*2.08+2,ey=(Math.max(...ys)-Math.min(...ys))*2.08+2;
  const rr=Math.min(.3,1.8/Math.max(ex,ey)),d=2.08*rr;
  sats=pts.map((p,i)=>({px:p.x*d,py:p.y*d,R:rr,a:0,t:0,col:COLS[i%6],off:-1,gone:false}));edges=[];
  const all=[];
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++)if(Math.hypot(pts[i].x-pts[j].x,(pts[i].y-pts[j].y))<1.05)all.push([i,j]);
  const deg=pts.map(()=>0);all.forEach(([i,j])=>{deg[i]++;deg[j]++});
  all.forEach(([i,j])=>{
    if(tier>=3&&deg[i]>1&&deg[j]>1&&rf()<.35){deg[i]--;deg[j]--;return}
    const A=sats[i],B=sats[j],g=Math.round(Math.atan2(B.py-A.py,B.px-A.px)*180/Math.PI),h=rnd(2)?i:j;
    edges.push({i,j,h,ang:h===i?g:g+180,done:false});
  });
  sats.forEach((s,i)=>{const hs=edges.filter(e=>e.h===i);let a;do{a=15*rnd(24)}while(hs.some(e=>norm(a-e.ang)<1||norm(a-e.ang)>359));s.a=s.t=a});
  par=edges.length;moves=0;won=false;winT=0;conf=[];document.getElementById('ov').style.display='none';upd();
}
function pyDown(e){
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(x){}
  const p=pos(e);let best=-1,bd=1e9;
  sats.forEach((s,i)=>{if(s.gone||s.off>=0)return;const c=sp(s),dd=Math.abs(Math.hypot(p.x-c.x,p.y-c.y)-s.R*S);if(dd<Math.min(LW(),s.R*S*.3)*1.6&&dd<bd){bd=dd;best=i}});
  if(best<0)return;const s=sats[best],c=sp(s);cv.setPointerCapture(e.pointerId);
  s.t=s.a;drag={i:best,last:Math.atan2(p.y-c.y,p.x-c.x)*180/Math.PI,a0:s.a,d:0};
}
function pyUp(){
  if(!drag)return;const s=sats[drag.i],t=Math.round((drag.a0+drag.d)/STEP)*STEP;
  if(Math.abs(t-drag.a0)>0.5){moves++;upd();snd(380+Math.random()*80,.07,'triangle')}s.t=t;drag=null;
}
function pyHint(){
  if(won||drag)return;const e=edges.find(e=>!e.done);if(!e)return;
  const h=sats[e.h],o=norm(h.t-e.ang);h.t+=o>180?360-o:-o;moves++;upd();
}
function pyDraw(dt){
  ctx.clearRect(0,0,W,H);
  edges.forEach(e=>{if(e.done)return;const h=sats[e.h];
    if(!(drag&&drag.i===e.h)&&Math.abs(h.t-h.a)<1){const o=norm(h.t-e.ang);if(o<1||o>359){e.done=true;snd(700,.1,'triangle')}}});
  sats.forEach((s,i)=>{
    if(s.gone)return;
    if(!(drag&&drag.i===i))s.a+=(s.t-s.a)*Math.min(1,dt*14);
    const free=!edges.some(e=>!e.done&&(e.i===i||e.j===i));
    if(free&&s.off<0&&!(drag&&drag.i===i)){s.off=0;snd(660,.15);setTimeout(()=>snd(880,.2),90)}
    let c=sp(s),al=1;
    if(s.off>=0){s.off+=dt*1.6;const m=Math.hypot(s.px,s.py),ux=m?s.px/m:0,uy=m?s.py/m:-1,o=s.off*S*0.9;c={x:c.x+ux*o,y:c.y+uy*o};al=Math.max(0,1-s.off);if(s.off>=1){s.gone=true;return}}
    ring(s,c,al);
  });
  edges.forEach(e=>{if(e.done)return;const h=sats[e.h],o=sats[e.i===e.h?e.j:e.i],c=sp(h),g=rad(e.ang),R=h.R*S,lw=Math.min(LW(),R*.3),x=c.x+Math.cos(g)*R,y=c.y+Math.sin(g)*R;
    ctx.save();ctx.translate(x,y);ctx.rotate(g);ctx.fillStyle=o.col;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(-lw*0.55,-lw*0.85,lw*1.1,lw*1.7,4);ctx.fill();ctx.stroke();ctx.restore()});
  fin(dt);
}
let ac=null,mute=false;
function snd(f,d=.08,ty='sine',v=.12){if(mute||!ac)return;try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d)}catch(e){}}
const lim=(s,v)=>s.dr?Math.max(s.lo,Math.min(s.hi,v)):v;
const D=()=>S*0.6,RS=()=>S*0.21,RH=()=>S*0.18,LW=()=>S*0.075;
function build(){rs=mb(level*7919+13);tier=Math.floor((level-1)/20);try{buildLevel()}finally{rs=null}}
function buildLevel(){
  mode=(level%4===1)?'hub':'py';if(mode==='py')return buildPy();
  document.getElementById('tip').textContent='Drag a ring until its gap reaches the green clamp. Dotted-arc rings (D-rings) can only turn within that range.';
  const n=Math.min(3+Math.floor(tier/2),6),off=rnd(360);
  sats=[];
  for(let i=0;i<n;i++){
    const th=off+i*360/n,cl=th+180;
    const dr=tier>=2&&i%2==1&&rf()<.3+tier*.07;
    let k=0;while(!k)k=dr?rnd(11)-5:rnd(23)-11;
    const g=cl+STEP*k;
    sats.push({th,cl,a:g,t:g,dr,lo:cl-90,hi:cl+90,col:COLS[i%COLS.length],lock:(tier>=1&&i>0&&rf()<Math.min(.2+tier*.08,.7))?i-1:-1,off:-1,gone:false});
  }
  par=sats.length;moves=0;won=false;winT=0;conf=[];
  document.getElementById('ov').style.display='none';upd();
}
function upd(){document.getElementById('lv').textContent='Level '+level+' / '+TOTAL;document.getElementById('mv').textContent='Moves: '+moves}
function resize(){const b=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=b.width*d;cv.height=b.height*d;ctx.setTransform(d,0,0,d,0,0);W=b.width;H=b.height;cx=W/2;cy=H/2;S=Math.min(W,H)/2}
const sp=s=>s.px!==undefined?{x:cx+s.px*S,y:cy+s.py*S}:{x:cx+Math.cos(rad(s.th))*D(),y:cy+Math.sin(rad(s.th))*D()};
const locked=s=>s.lock>=0&&!sats[s.lock].gone;
const isOpen=s=>{const o=norm(s.t-s.cl);return o<1||o>359};
function pos(e){const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}}
cv.addEventListener('pointerdown',e=>{
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  if(mode==='py'&&!won)return pyDown(e);
  if(won)return;const p=pos(e);let best=-1,bd=1e9;
  sats.forEach((s,i)=>{if(s.gone||s.off>=0)return;const c=sp(s),d=Math.abs(Math.hypot(p.x-c.x,p.y-c.y)-RS());if(d<LW()*1.6&&d<bd){bd=d;best=i}});
  if(best<0)return;const s=sats[best];
  if(locked(s)){shake=0.35;shakeI=best;snd(160,.12,'square',.05);return}
  cv.setPointerCapture(e.pointerId);const c=sp(s);
  s.t=s.a;drag={i:best,last:Math.atan2(p.y-c.y,p.x-c.x)*180/Math.PI,a0:s.a,d:0};
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;const s=sats[drag.i],c=sp(s),p=pos(e);
  const a=Math.atan2(p.y-c.y,p.x-c.x)*180/Math.PI;let dl=a-drag.last;
  if(dl>180)dl-=360;if(dl<-180)dl+=360;drag.last=a;drag.d+=dl;const v=lim(s,drag.a0+drag.d);drag.d=v-drag.a0;s.a=s.t=v;
});
function release(){
  if(mode==='py'){pyUp();return}
  if(!drag)return;const s=sats[drag.i],t=lim(s,s.cl+Math.round((drag.a0+drag.d-s.cl)/STEP)*STEP);
  if(Math.abs(t-drag.a0)>0.5){moves++;upd();snd(380+Math.random()*80,.07,'triangle')}s.t=t;drag=null;
}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
document.getElementById('rs').onclick=build;
document.getElementById('mu').onclick=e=>{mute=!mute;e.target.textContent='Sound: '+(mute?'off':'on')};
function sv(){try{localStorage.setItem('ar_level',level)}catch(e){}}
document.getElementById('nx').onclick=()=>{if(level>=TOTAL){openSel();return}level++;sv();build()};
function openSel(){
  const g=document.getElementById('grid');let m={};try{m=JSON.parse(localStorage.getItem('ar_stars')||'{}')}catch(e){}
  g.innerHTML='';
  for(let i=1;i<=TOTAL;i++){const b=document.createElement('button');b.className='lv'+(i===level?' cur':'');b.innerHTML=i+'<small>'+('★'.repeat(m[i]||0))+'</small>';b.onclick=()=>{level=i;sv();document.getElementById('sel').style.display='none';build()};g.appendChild(b)}
  document.getElementById('sel').style.display='flex';
}
document.getElementById('lb').onclick=openSel;
document.getElementById('cl').onclick=()=>{document.getElementById('sel').style.display='none'};
document.getElementById('hint').onclick=()=>{
  if(mode==='py'){pyHint();return}
  if(won||drag)return;const s=sats.find(s=>!s.gone&&s.off<0&&!locked(s)&&!isOpen(s));
  if(!s)return;const o=norm(s.t-s.cl);s.t+=o>180?360-o:-o;moves++;upd();
};
function ring(s,c,alpha){
  const R=s.R?s.R*S:RS(),lw=s.R?Math.min(LW(),R*0.3):LW(),h=rad(HALF),a=rad(s.a);
  ctx.globalAlpha=alpha;ctx.lineCap='round';
  if(s.dr){ctx.setLineDash([3,7]);ctx.strokeStyle='rgba(90,58,18,.55)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(c.x,c.y,R+lw*1.05,rad(s.lo),rad(s.hi));ctx.stroke();ctx.setLineDash([]);
    [s.lo,s.hi].forEach(q=>{ctx.fillStyle='rgba(90,58,18,.8)';ctx.beginPath();ctx.arc(c.x+Math.cos(rad(q))*(R+lw*1.05),c.y+Math.sin(rad(q))*(R+lw*1.05),5,0,7);ctx.fill()})}
  ctx.strokeStyle=s.col;ctx.lineWidth=lw;ctx.beginPath();ctx.arc(c.x,c.y,R,a+h,a-h+Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=lw*0.28;ctx.beginPath();ctx.arc(c.x-lw*0.12,c.y-lw*0.12,R,a+h,a-h+Math.PI*2);ctx.stroke();
  if(locked(s)){ctx.fillStyle='rgba(60,40,20,.55)';ctx.beginPath();ctx.arc(c.x,c.y,R*0.45,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font=`${R*0.5}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🔒',c.x,c.y+2)}
  ctx.globalAlpha=1;
}
function acorn(x,y,r,sc){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.fillStyle='#f5b81c';ctx.beginPath();ctx.ellipse(0,r*0.15,r*0.7,r*0.8,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(-r*0.25,-r*0.05,r*0.14,r*0.3,0.4,0,7);ctx.fill();
  ctx.fillStyle='#b9741f';ctx.beginPath();ctx.ellipse(0,-r*0.35,r*0.8,r*0.45,0,Math.PI,0);ctx.fill();
  ctx.fillRect(-r*0.06,-r*0.95,r*0.12,r*0.3);ctx.restore();
}
function burst(){for(let i=0;i<70;i++)conf.push({x:cx,y:cy,vx:(Math.random()-.5)*600,vy:-Math.random()*500-100,c:COLS[rnd(6)],r:Math.random()*6})}
function draw(dt){
  if(mode==='py'){pyDraw(dt);return}
  ctx.clearRect(0,0,W,H);
  const hr=RH(),lw=LW();
  // hub + connectors
  sats.forEach(s=>{if(s.gone||s.off>0.1)return;const c=sp(s),cl=rad(s.cl);
    const px=c.x+Math.cos(cl)*RS(),py=c.y+Math.sin(cl)*RS();
    ctx.strokeStyle='#4fae1f';ctx.lineWidth=lw*0.35;ctx.beginPath();ctx.moveTo(cx+Math.cos(cl)*hr*0.9*-1*-1*0+Math.cos(rad(s.th))*hr,cy+Math.sin(rad(s.th))*hr);ctx.lineTo(px,py);ctx.stroke()});
  ctx.strokeStyle='#58b81f';ctx.lineWidth=lw;ctx.beginPath();ctx.arc(cx,cy,hr,0,7);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=lw*0.28;ctx.beginPath();ctx.arc(cx-lw*0.12,cy-lw*0.12,hr,0,7);ctx.stroke();
  const ws=won?1+Math.sin(winT*10)*0.08*Math.max(0,1-winT/1.5)+0.15:1;
  acorn(cx,cy,hr*0.7,ws);
  // satellites
  sats.forEach((s,i)=>{
    if(s.gone)return;
    if(!(drag&&drag.i===i))s.a+=(s.t-s.a)*Math.min(1,dt*14);
    let c=sp(s),alpha=1;
    if(s.off<0&&!drag&&Math.abs(s.t-s.a)<1&&isOpen(s)&&!locked(s)){s.off=0;snd(660,.15);setTimeout(()=>snd(880,.2),90)}
    if(s.off>=0){s.off+=dt*1.6;const o=s.off*S*0.9;c={x:c.x+Math.cos(rad(s.th))*o,y:c.y+Math.sin(rad(s.th))*o};alpha=Math.max(0,1-s.off);if(s.off>=1){s.gone=true;return}}
    if(shake>0&&shakeI===i)c.x+=Math.sin(shake*60)*5;
    ring(s,c,alpha);
    if(s.off<0.1){const cl=rad(s.cl),x=c.x+Math.cos(cl)*RS(),y=c.y+Math.sin(cl)*RS();
      ctx.save();ctx.translate(x,y);ctx.rotate(cl);ctx.fillStyle='#6cd02a';ctx.strokeStyle='#3f8f14';ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(-lw*0.45,-lw*0.8,lw*0.9,lw*1.6,4);ctx.fill();ctx.stroke();ctx.restore()}
  });
  if(shake>0)shake-=dt;
  fin(dt)
}
function fin(dt){
  if(!won&&sats.every(s=>s.gone)){won=true;winT=0;burst();[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.3),i*110))}
  if(won){winT+=dt;
    conf.forEach(p=>{p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.r+3,p.r+3)});
    if(winT>0.9&&document.getElementById('ov').style.display!=='flex'){
      const n=par,st=moves<=n?3:moves<=Math.ceil(n*1.25)+1?2:1;try{const m=JSON.parse(localStorage.getItem('ar_stars')||'{}');m[level]=Math.max(m[level]||0,st);localStorage.setItem('ar_stars',JSON.stringify(m))}catch(e){}document.getElementById('res').textContent='★'.repeat(st)+'☆'.repeat(3-st)+'  '+moves+' moves (par '+n+')';
      document.getElementById('ov').style.display='flex'}}
}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;draw(dt);requestAnimationFrame(loop)}
addEventListener('resize',resize);resize();build();requestAnimationFrame(loop);
</script></body></html>
